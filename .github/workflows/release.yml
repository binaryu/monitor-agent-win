name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: monitor-agent.exe
            archive_name: monitor-agent-windows-x86_64.zip
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            artifact_name: monitor-agent.exe
            archive_name: monitor-agent-windows-arm64.zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: monitor-agent
            archive_name: monitor-agent-linux-x86_64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Windows ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging
          Copy-Item target/${{ matrix.target }}/release/monitor-agent.exe -Destination staging/
          if (Test-Path install-service.ps1) { Copy-Item install-service.ps1 -Destination staging/ }
          if (Test-Path README.md) { Copy-Item README.md -Destination staging/ }
          Compress-Archive -Path staging/* -DestinationPath ${{ matrix.archive_name }}

      - name: Package Linux Tarball
        if: runner.os == 'Linux'
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/monitor-agent staging/
          [ -f README.md ] && cp README.md staging/
          tar -czf ${{ matrix.archive_name }} -C staging .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.archive_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts directory
        run: |
          mkdir -p dist
          find artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} dist/ \;
          ls -la dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
